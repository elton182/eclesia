openapi: 3.0.3
info:
  title: Eclesia API
  version: 0.7.0
  description: |
    API multi-tenant do Eclesia (gestão eclesial).
    Contexto central (landlord): `/admin/*`.
    Contexto tenant: header `X-Tenant` (slug) + auth web/Sanctum.
    Igreja atual: header `X-Igreja` (ULID) validado contra o acesso do ator → IgrejaContext.
    Login web resolve tenant por slug|apelido|nome no body (sem X-Tenant obrigatório).
    Dados pessoais criptografados em repouso (LGPD).
    Site público do tenant: `/public/site*` (X-Tenant, sem auth) — SPEC-005 / ADR-0003.
    Escalas genéricas (núcleo): `/escalas*` — SPEC-007 / ADR-0005.
servers:
  - url: http://localhost:8000/api/v1
    description: Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant
    igrejaHeader:
      type: apiKey
      in: header
      name: X-Igreja
      description: ULID da igreja atual (opcional; sem header usa a primeira acessível)
  schemas:
    Igreja:
      type: object
      properties:
        id:
          type: string
          description: ULID
        nome:
          type: string
        tipo:
          type: string
          enum: [paroquia, comunidade, outro]
        endereco:
          type: string
          nullable: true
        bairro:
          type: string
          nullable: true
        cidade:
          type: string
          nullable: true
        uf:
          type: string
          nullable: true
          maxLength: 2
        cep:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        slug:
          type: string
          nullable: true
        publicado_no_site:
          type: boolean
        descricao_publica:
          type: string
          nullable: true
        horario_missas:
          type: string
          nullable: true
        banner_media_id:
          type: string
          nullable: true
          description: ULID de site_media
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SiteSettings:
      type: object
      properties:
        publicado:
          type: boolean
        titulo:
          type: string
        subtitulo:
          type: string
          nullable: true
        logo_path:
          type: string
          nullable: true
        favicon_path:
          type: string
          nullable: true
        seo:
          type: object
          additionalProperties: true
        contato:
          type: object
          additionalProperties: true
        menu:
          type: array
          items:
            type: object
            additionalProperties: true
    SitePage:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        titulo:
          type: string
        status:
          type: string
          enum: [rascunho, publicado]
        is_home:
          type: boolean
        ordem:
          type: integer
        mostrar_no_menu:
          type: boolean
        seo:
          type: object
          nullable: true
          additionalProperties: true
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/SiteBlock'
    SiteBlock:
      type: object
      properties:
        id:
          type: string
        tipo:
          type: string
          enum: [hero, banner, richtext, igrejas_list, comunicados_list, pastorais_list, form, html, missas_horarios, sobre_paroquia, agenda_eventos, equipe_clero, contato_local]
        ordem:
          type: integer
        visivel:
          type: boolean
        payload:
          type: object
          additionalProperties: true
    SiteComunicado:
      type: object
      properties:
        id:
          type: string
        titulo:
          type: string
        resumo:
          type: string
          nullable: true
        corpo:
          type: string
        capa_media_id:
          type: string
          nullable: true
        publicado_em:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [rascunho, publicado]
        destaque:
          type: boolean
        igreja_id:
          type: string
          nullable: true
    Pastoral:
      type: object
      properties:
        id:
          type: string
        igreja_id:
          type: string
        nome:
          type: string
        descricao_publica:
          type: string
          nullable: true
        contato_publico:
          type: string
          nullable: true
        ordem:
          type: integer
        publicado_no_site:
          type: boolean
        ativa:
          type: boolean
    SiteForm:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        slug:
          type: string
        descricao:
          type: string
          nullable: true
        ativo:
          type: boolean
        destino_email:
          type: string
          nullable: true
        sucesso_mensagem:
          type: string
          nullable: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SiteFormField'
    SiteFormField:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        label:
          type: string
        tipo:
          type: string
          enum: [text, email, tel, textarea, select, checkbox]
        obrigatorio:
          type: boolean
        opcoes:
          type: array
          items:
            type: string
        ordem:
          type: integer
    SiteMedia:
      type: object
      properties:
        id:
          type: string
        path:
          type: string
        alt:
          type: string
          nullable: true
        mime:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        aliases:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    User:
      type: object
      properties:
        id:
          type: string
          description: ULID público
        name:
          type: string
        email:
          type: string
          format: email
        is_active:
          type: boolean
        pessoa_id:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              igreja_id:
                type: string
                nullable: true
        equipes_lideradas:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              nome:
                type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        guard_name:
          type: string
    Permission:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        guard_name:
          type: string
    EccEquipe:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        cor:
          type: string
          nullable: true
        casais_count:
          type: integer
    EccCasal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        equipe_id:
          type: string
          format: uuid
          nullable: true
        equipe_nome:
          type: string
          nullable: true
        nome:
          type: string
          description: Pessoa A (ordem de cadastro); preferir ele/ela para exibição
        email:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        data_nascimento:
          type: string
          nullable: true
        sexo:
          type: string
          nullable: true
          enum: [M, F]
        nome_conjuge:
          type: string
          description: Pessoa B (ordem de cadastro); preferir ele/ela para exibição
        email_conjuge:
          type: string
          nullable: true
        telefone_conjuge:
          type: string
          nullable: true
        data_nascimento_conjuge:
          type: string
          nullable: true
        sexo_conjuge:
          type: string
          nullable: true
          enum: [M, F]
        ele:
          allOf:
            - $ref: '#/components/schemas/PessoaResumo'
          nullable: true
          description: Cônjuge masculino (por sexo; fallback = pessoa A)
        ela:
          allOf:
            - $ref: '#/components/schemas/PessoaResumo'
          nullable: true
          description: Cônjuge feminino (por sexo; fallback = pessoa B)
        endereco:
          type: string
          nullable: true
        bairro:
          type: string
          nullable: true
        cidade:
          type: string
          nullable: true
        uf:
          type: string
          nullable: true
        cep:
          type: string
          nullable: true
        data_casamento:
          type: string
          nullable: true
        filhos:
          type: string
          nullable: true
        observacoes:
          type: string
          nullable: true
        ficha_com_foto:
          type: boolean
          description: Derivado — true se ele ou ela possui foto cadastrada (somente leitura)
        piloto:
          type: boolean
    PessoaResumo:
      type: object
      properties:
        id:
          type: string
          description: ULID da pessoa
        nome:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        data_nascimento:
          type: string
          nullable: true
        sexo:
          type: string
          nullable: true
          enum: [M, F]
        foto_url:
          type: string
          nullable: true
          description: >
            URL assinada temporária de GET /pessoas/{id}/foto (query tenant + signature).
            Adequada para <img src>; não usa /storage do symlink central.
    Pessoa:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        email:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        data_nascimento:
          type: string
          nullable: true
        sexo:
          type: string
          nullable: true
          enum: [M, F]
        foto_url:
          type: string
          nullable: true
          description: URL assinada temporária para GET /pessoas/{id}/foto
        igreja_id:
          type: string
    EscalaTipo:
      type: object
      properties:
        id:
          type: string
          description: ULID
        nome:
          type: string
        descricao:
          type: string
          nullable: true
        unidade_preferida:
          type: string
          enum: [pessoa, casal, ambos]
        recorrencia:
          type: string
          enum: [avulsa, semanal, mensal]
        equipes_count:
          type: integer
        ocorrencias_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EscalaEquipe:
      type: object
      properties:
        id:
          type: string
        escala_tipo_id:
          type: string
        nome:
          type: string
        cor:
          type: string
          nullable: true
        ordem:
          type: integer
        vagas_sugeridas:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EscalaOcorrencia:
      type: object
      properties:
        id:
          type: string
        escala_tipo_id:
          type: string
        titulo:
          type: string
          nullable: true
        inicia_em:
          type: string
          format: date-time
        termina_em:
          type: string
          format: date-time
          nullable: true
        local:
          type: string
          nullable: true
        evento_agenda_id:
          type: string
          nullable: true
        tipo_nome:
          type: string
          nullable: true
        atribuicoes:
          type: array
          items:
            $ref: '#/components/schemas/EscalaAtribuicao'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EscalaAtribuicao:
      type: object
      properties:
        id:
          type: string
        escala_ocorrencia_id:
          type: string
        escala_equipe_id:
          type: string
        equipe_nome:
          type: string
          nullable: true
        pessoa_id:
          type: string
          nullable: true
        casal_id:
          type: string
          nullable: true
        pessoa_nome:
          type: string
          nullable: true
        casal_rotulo:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    EventoAgenda:
      type: object
      properties:
        id:
          type: string
        titulo:
          type: string
        inicia_em:
          type: string
          format: date-time
        termina_em:
          type: string
          format: date-time
          nullable: true
        local:
          type: string
          nullable: true
        dono_modulo:
          type: string
        tipo:
          type: string
        referencia_tipo:
          type: string
          nullable: true
        referencia_id:
          type: string
          nullable: true
    EccEvento:
      type: object
      properties:
        id:
          type: string
        titulo:
          type: string
        tipo:
          type: string
          enum: [encontro, anual, servos, perseveranca, formacao]
        inicia_em:
          type: string
          format: date-time
        termina_em:
          type: string
          format: date-time
          nullable: true
        local:
          type: string
          nullable: true
        casal_compras_id:
          type: string
          nullable: true
        evento_agenda_id:
          type: string
          nullable: true
        participantes_count:
          type: integer
        participantes:
          type: array
          items:
            $ref: '#/components/schemas/EccEventoParticipante'
        itens_compra:
          type: array
          items:
            $ref: '#/components/schemas/EccItemCompra'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EccEventoParticipante:
      type: object
      properties:
        casal_id:
          type: string
        casal_rotulo:
          type: string
          nullable: true
    EccItemCompra:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        qtd:
          type: number
        unidade:
          type: string
        status:
          type: string
          enum: [pendente, doado, comprado]
        doador_casal_id:
          type: string
          nullable: true
        doador_rotulo:
          type: string
          nullable: true
        valor_gasto:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
paths:
  /health:
    get:
      summary: Health check (central ou tenant conforme host/contexto)
      responses:
        '200':
          description: OK
  /admin/login:
    post:
      summary: Login super-admin (plataforma)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Token Sanctum + dados do admin
        '403':
          description: Credenciais inválidas
  /admin/me:
    post:
      summary: Super-admin autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do admin
        '401':
          description: Não autenticado
  /admin/logout:
    post:
      summary: Logout super-admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout efetuado
  /admin/tenants:
    get:
      summary: Listar tenants
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de tenants
    post:
      summary: Criar tenant (provisiona banco)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                slug:
                  type: string
                  pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
                aliases:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Tenant criado
        '422':
          description: Validação
  /admin/tenants/{id}:
    get:
      summary: Detalhe do tenant
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant
        '404':
          description: Não encontrado
    put:
      summary: Atualizar tenant
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                aliases:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Atualizado
    delete:
      summary: Remover tenant e banco
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removido
  /web/login:
    post:
      summary: Login web (tenant)
      description: |
        Resolve a organização por `tenant` (slug, apelido ou nome único) sem exigir X-Tenant.
        E-mail via whereEncrypted (LGPD). Retorna cookies + slug canônico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant, email, password]
              properties:
                tenant:
                  type: string
                  description: Slug, apelido ou nome da organização
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login OK (access_token + cookies + tenant.slug)
        '403':
          description: Credenciais inválidas
        '404':
          description: Organização não encontrada
        '422':
          description: Validação ou nome ambíguo
  /web/refresh:
    post:
      summary: Renovar access token (cookie refresh ou body refresh_token)
      description: Requer X-Tenant. Usado pelo SPA quando o Bearer expira.
      security:
        - tenantHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Novo access_token
        '401':
          description: Refresh inválido ou expirado
  /web/me:
    post:
      summary: Usuário autenticado (tenant)
      security:
        - tenantHeader: []
      responses:
        '200':
          description: Dados do usuário (roles/permissions)
        '401':
          description: Não autenticado
  /web/logout:
    post:
      summary: Logout web (tenant)
      security:
        - tenantHeader: []
      responses:
        '200':
          description: Logout efetuado
  /igrejas:
    get:
      summary: Listar igrejas acessíveis ao ator (seletor + cadastro)
      security:
        - tenantHeader: []
          bearerAuth: []
        - tenantHeader: []
          igrejaHeader: []
          bearerAuth: []
      responses:
        '200':
          description: Lista de igrejas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Igreja'
        '401':
          description: Não autenticado
    post:
      summary: Criar igreja (admin-tenant)
      security:
        - tenantHeader: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, tipo]
              properties:
                nome:
                  type: string
                tipo:
                  type: string
                  enum: [paroquia, comunidade, outro]
                endereco:
                  type: string
                  nullable: true
                bairro:
                  type: string
                  nullable: true
                cidade:
                  type: string
                  nullable: true
                uf:
                  type: string
                  nullable: true
                  maxLength: 2
                cep:
                  type: string
                  nullable: true
                telefone:
                  type: string
                  nullable: true
                email:
                  type: string
                  format: email
                  nullable: true
      responses:
        '201':
          description: Igreja criada
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '422':
          description: Validação
  /igrejas/{id}:
    get:
      summary: Detalhe da igreja
      security:
        - tenantHeader: []
          bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Igreja
        '403':
          description: Sem acesso
        '404':
          description: Não encontrada
    put:
      summary: Atualizar igreja (admin-tenant qualquer; admin-igreja só a própria)
      security:
        - tenantHeader: []
          bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                tipo:
                  type: string
                  enum: [paroquia, comunidade, outro]
                endereco:
                  type: string
                  nullable: true
                bairro:
                  type: string
                  nullable: true
                cidade:
                  type: string
                  nullable: true
                uf:
                  type: string
                  nullable: true
                cep:
                  type: string
                  nullable: true
                telefone:
                  type: string
                  nullable: true
                email:
                  type: string
                  format: email
                  nullable: true
      responses:
        '200':
          description: Igreja atualizada
        '403':
          description: Sem permissão
        '404':
          description: Não encontrada
        '422':
          description: Validação
    delete:
      summary: Excluir igreja (admin-tenant; bloqueado se houver vínculos)
      security:
        - tenantHeader: []
          bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removida
        '403':
          description: Sem permissão
        '404':
          description: Não encontrada
        '409':
          description: Possui vínculos (pessoas, equipes ou casais)
  /users:
    get:
      summary: Listar usuários do tenant
      security:
        - tenantHeader: []
      responses:
        '200':
          description: Lista paginada
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
    post:
      summary: Criar usuário
      security:
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
