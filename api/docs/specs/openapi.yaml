        '422':
          description: Validação
  /ecc/equipes/{id}/acesso:
    post:
      summary: Criar acesso da equipe
      description: |
        SPEC-021. Requer ecc.equipes.manage. Cria usuário compartilhado (username + senha
        inicial 1234 + must_change_password). Se já existe acesso → 422.
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Acesso criado (username + password uma vez)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      password:
                        type: string
                      tem_acesso:
                        type: boolean
                      acesso_username:
                        type: string
        '403':
          description: Sem permissão
        '422':
          description: Já possui acesso
    put:
      summary: Alterar login (username) do acesso da equipe
      description: |
        SPEC-024. Requer ecc.equipes.manage. Atualiza username (+ e-mail sintético) do
        usuário de acesso. Não altera senha nem must_change_password. Revoga tokens.
        Sem acesso → 422. Username colidindo → 422.
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  maxLength: 120
                  description: Novo login (normalizado para slug)
                  example: equipe-cana
      responses:
        '200':
          description: Login alterado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      tem_acesso:
                        type: boolean
                      acesso_username:
                        type: string
        '403':
          description: Sem permissão
        '422':
          description: Sem acesso, username inválido ou já em uso
  /ecc/equipes/{id}/acesso/reset-senha:
