              required: [roles]
              properties:
                igreja_id:
                  type: string
                  nullable: true
                  description: Obrigatório se houver papel de igreja
                roles:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        enum: [admin-tenant, gestor-site, admin-igreja, cadastros-usuarios, cadastros-equipes, cadastros-casais, cadastros-eventos, cadastros-escalas, lider-equipe]
                      equipe_ids:
                        type: array
                        items:
                          type: string
                        description: Obrigatório quando name=lider-equipe
