  /pessoas/{id}/foto:
    get:
      summary: Servir arquivo da foto da pessoa
      description: >
        Stream do arquivo no storage do tenant. Autorização via URL assinada
        (expires + signature) gerada em `foto_url`. Tenant via query `tenant`
        (ADR-0002; <img> não envia X-Tenant). Spec: SPEC-006.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: tenant
          in: query
          required: true
          schema:
            type: string
          description: Slug do tenant
        - name: expires
          in: query
          required: true
          schema:
            type: integer
        - name: signature
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Imagem
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '403':
          description: Assinatura inválida ou expirada
        '404':
          description: Pessoa ou arquivo ausente
    post:
      summary: Upload ou substituição da foto da pessoa
      description: >
        Multipart field `file`. Requer `pessoas.manage` ou `ecc.casais.manage`.
        Atualiza `ficha_com_foto` dos casais vinculados. Spec: SPEC-006.
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: jpg, jpeg, png ou webp — máx. 5 MB
      responses:
        '200':
          description: Pessoa com foto_url atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Pessoa'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '404':
          description: Pessoa não encontrada na igreja atual
        '422':
          description: Arquivo inválido
    delete:
      summary: Remover foto da pessoa
      description: Requer `pessoas.manage` ou `ecc.casais.manage`. Spec: SPEC-006.
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Foto removida
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '404':
          description: Pessoa não encontrada
