  /ecc/financeiro/depositos:
    get:
      summary: Listar depósitos mensais de equipes
      description: >
        Líder vê só as próprias equipes. Gestor (ecc.financeiro.view|manage) vê todos.
        Filtros opcionais status, competencia (YYYY-MM), equipe_id.
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [provisionado, confirmado, rejeitado]
        - name: competencia
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
        - name: equipe_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de depósitos
        '403':
          description: Sem permissão
    post:
      summary: Submeter depósito mensal da equipe
      description: >
        Cria depósito + lançamento de entrada com status provisionado.
        Permissão ecc.financeiro.depositos.submeter (líder da equipe) ou manage.
        Comprovante multipart PDF/JPG/PNG até 5 MB.
      security:
        - bearerAuth: []
          tenantHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [equipe_id, competencia, valor, comprovante]
              properties:
                equipe_id:
                  type: string
                competencia:
                  type: string
                  description: YYYY-MM
                  pattern: '^\d{4}-\d{2}$'
                valor:
                  type: number
                  minimum: 0.01
                conta_id:
                  type: string
                  description: Opcional; padrão Conta ECC (banco)
                comprovante:
                  type: string
                  format: binary
      responses:
        '201':
          description: Depósito provisionado
        '403':
          description: Sem permissão
        '404':
          description: Equipe fora do escopo do líder
        '422':
          description: Validação / competência já possui depósito ativo

