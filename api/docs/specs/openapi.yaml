        '403': {description: Sem permissão}
    post:
      summary: Criar espaço ou recurso
      security: [{bearerAuth: [], tenantHeader: [], igrejaHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
