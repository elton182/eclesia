openapi: 3.0.3
info:
  title: Apostolus API
  version: 0.8.0
  description: |
    API multi-tenant do Apostolus (gestão eclesial).
    Contexto central (landlord): `/admin/*`.
    Contexto tenant: header `X-Tenant` (slug) + auth web/Sanctum.
    Igreja atual: header `X-Igreja` (ULID) validado contra o acesso do ator → IgrejaContext.
    Login web resolve tenant por slug|apelido|nome no body (sem X-Tenant obrigatório).
    Dados pessoais criptografados em repouso (LGPD).
    Site público do tenant: `/public/site*` (X-Tenant, sem auth) — SPEC-005 / ADR-0003.
    SEO HTML/sitemap: `/public/site/html/{tenantSlug}` e `/public/site/sitemap/{tenantSlug}`
    (tenancy pelo path). Manifest PWA de acesso: `/public/site/manifest/{tenantSlug}`
    (SPEC-023 / ADR-0009; servir no front em `/site/{slug}/manifest.webmanifest`).
    (tenancy pelo slug no path; sem X-Tenant).
servers:
  - url: http://localhost:8000/api/v1
    description: Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant
    igrejaHeader:
      type: apiKey
      in: header
      name: X-Igreja
      description: ULID da igreja atual (opcional; sem header usa a primeira acessível)
  schemas:
    AuditLog:
      type: object
      properties:
        id:
          type: string
          description: ULID
        action:
          type: string
          enum: [created, updated, deleted, login_success, login_failed, logout, roles_synced]
        actor_type:
          type: string
          enum: [user, super_admin, anonymous, system]
        actor_label:
          type: string
          nullable: true
        actor_user_id:
          type: string
          nullable: true
          description: ULID do usuário ator (quando aplicável)
        auditable_type:
          type: string
          nullable: true
        auditable_id:
          type: string
          nullable: true
          description: ULID ou id público do recurso
        auditable_label:
          type: string
          nullable: true
        old_values:
          type: object
          nullable: true
          additionalProperties: true
        new_values:
          type: object
          nullable: true
          additionalProperties: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        igreja_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    Igreja:
      type: object
      properties:
        id:
          type: string
          description: ULID
        nome:
          type: string
        tipo:
          type: string
          enum: [paroquia, comunidade, outro]
        endereco:
          type: string
          nullable: true
        bairro:
          type: string
          nullable: true
        cidade:
          type: string
          nullable: true
        uf:
          type: string
          nullable: true
          maxLength: 2
        diocese:
          type: string
          nullable: true
          description: Nome da diocese (exibido no PDF do calendário oficial)
        cep:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        slug:
          type: string
          nullable: true
        publicado_no_site:
          type: boolean
        descricao_publica:
          type: string
          nullable: true
        horario_missas:
          type: string
          nullable: true
        banner_media_id:
          type: string
          nullable: true
          description: ULID de site_media
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AppBrandingCores:
      type: object
      nullable: true
      description: Branding do app autenticado (SPEC-014). Hex #RRGGBB. Fallback vinho no front.
      properties:
        primary:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        secondary:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        text:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        text_muted:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        on_primary:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
      additionalProperties: false
    AppBranding:
      type: object
      properties:
        logo_path:
          type: string
          nullable: true
        logo_url:
          type: string
          nullable: true
          description: URL assinada para exibir a logo da organização (direita no PDF)
        logo_diocese_path:
          type: string
          nullable: true
        logo_diocese_url:
          type: string
          nullable: true
          description: URL assinada da logo da diocese (esquerda no PDF)
        cores:
          $ref: '#/components/schemas/AppBrandingCores'
    SiteSettings:
      type: object
      properties:
        publicado:
          type: boolean
        titulo:
          type: string
          description: Espelho de tenants.name (somente leitura; SPEC-011)
        logo_path:
          type: string
          nullable: true
          description: Espelho de app_settings.logo_path (SPEC-014)
        logo_url:
          type: string
          nullable: true
          description: URL assinada da logo do app (SPEC-014)
        cores:
          allOf:
            - $ref: '#/components/schemas/AppBrandingCores'
          nullable: true
          description: Espelho de app_settings.cores (SPEC-014 / SPEC-011)
        seo:
          type: object
          additionalProperties: true
        contato:
          type: object
          additionalProperties: true
        menu:
          type: array
          items:
            type: object
            additionalProperties: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    SitePage:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        titulo:
          type: string
        status:
          type: string
          enum: [rascunho, publicado]
        is_home:
          type: boolean
        ordem:
          type: integer
        mostrar_no_menu:
          type: boolean
        seo:
          type: object
          nullable: true
          additionalProperties: true
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/SiteBlock'
    SiteBlock:
      type: object
      properties:
        id:
          type: string
        tipo:
          type: string
          enum: [hero, banner, richtext, igrejas_list, comunicados_list, pastorais_list, form, html, missas_horarios, sobre_paroquia, agenda_eventos, equipe_clero, contato_local]
        ordem:
          type: integer
        visivel:
          type: boolean
        payload:
          type: object
          additionalProperties: true
    SiteComunicado:
      type: object
      properties:
        id:
          type: string
        titulo:
          type: string
        resumo:
          type: string
          nullable: true
        corpo:
          type: string
        capa_media_id:
          type: string
          nullable: true
        publicado_em:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [rascunho, publicado]
        destaque:
          type: boolean
        igreja_id:
          type: string
          nullable: true
    Pastoral:
      type: object
      properties:
        id:
          type: string
        igreja_id:
          type: string
        nome:
          type: string
        descricao_publica:
          type: string
          nullable: true
        contato_publico:
          type: string
          nullable: true
        ordem:
          type: integer
        publicado_no_site:
          type: boolean
        ativa:
          type: boolean
        membros:
          type: array
          items:
            $ref: '#/components/schemas/PastoralMembro'
    PastoralMembro:
      type: object
      properties:
        user_id:
          type: string
          description: ULID do usuário
        name:
          type: string
        email:
          type: string
        papel:
          type: string
          enum: [coordenador, membro]
    PlanejamentoAnual:
      type: object
      properties:
        id:
          type: string
        igreja_id:
          type: string
        ano:
          type: integer
        status:
          type: string
          enum: [rascunho, coleta, revisao, fechado]
        fechado_em:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlanejamentoEventoConflito:
      type: object
      properties:
        id:
          type: string
        titulo:
          type: string
        pastoral_id:
          type: string
        data_inicio:
          type: string
          format: date
        data_fim:
          type: string
          format: date
          nullable: true
        hora_inicio:
          type: string
          nullable: true
        hora_fim:
          type: string
          nullable: true
        local_ids:
          type: array
          items:
            type: string
    PlanejamentoEvento:
      type: object
      properties:
        id:
          type: string
        planejamento_anual_id:
          type: string
        pastoral_id:
          type: string
        titulo:
          type: string
        data_inicio:
          type: string
          format: date
        data_fim:
          type: string
          format: date
          nullable: true
        hora_inicio:
          type: string
          nullable: true
          example: '19:30'
        hora_fim:
          type: string
          nullable: true
        participantes_media:
          type: integer
          nullable: true
        recorrencia_texto:
          type: string
          nullable: true
        observacoes:
          type: string
          nullable: true
        local_texto:
          type: string
          nullable: true
        local_ids:
          type: array
          items:
            type: string
        status_solicitacao:
          type: string
          enum: [proposta, confirmado, ajuste_solicitado, reagendado, recusado, cotidiano]
        motivo_ajuste:
          type: string
          nullable: true
        conflitos:
          type: array
          items:
            $ref: '#/components/schemas/PlanejamentoEventoConflito'
          description: Alertas de conflito (mesmo local + horário sobreposto); HTTP 2xx mesmo com itens
        recursos:
          type: array
          items:
            $ref: '#/components/schemas/PlanejamentoEventoRecurso'
    PlanejamentoRecurso:
      type: object
      properties:
        id: {type: string}
        nome: {type: string}
        tipo: {type: string, enum: [espaco, recurso]}
        quantidade: {type: integer, minimum: 1}
        descricao: {type: string, nullable: true}
        ativo: {type: boolean}
        ordem: {type: integer}
    PlanejamentoEventoRecurso:
      type: object
      properties:
        recurso_id: {type: string}
        nome: {type: string}
        tipo: {type: string, enum: [espaco, recurso]}
        quantidade: {type: integer, minimum: 1}
    PlanejamentoRecursoInput:
      type: object
      required: [recurso_id]
      properties:
        recurso_id: {type: string}
        quantidade: {type: integer, minimum: 1, default: 1}
    PlanejamentoDisponibilidade:
      type: object
      properties:
        recurso_id: {type: string}
        nome: {type: string}
        tipo: {type: string, enum: [espaco, recurso]}
        quantidade: {type: integer}
        disponivel: {type: integer, description: Quantidade livre no intervalo}
    PlanejamentoConflitoRecurso:
      type: object
      description: Item do 422 de capacidade (SPEC-019). No link público `eventos` é omitido.
      properties:
        recurso_id: {type: string}
        nome: {type: string}
        tipo: {type: string}
        quantidade: {type: integer}
        disponivel: {type: integer}
        pedido: {type: integer}
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/PlanejamentoEventoConflito'
    PlanejamentoErroCapacidade:
      type: object
      properties:
        message: {type: string}
        errors:
          type: object
          properties:
            recursos:
              type: array
              items: {type: string}
        conflitos_recursos:
          type: array
          items:
            $ref: '#/components/schemas/PlanejamentoConflitoRecurso'
    SiteForm:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        slug:
          type: string
        descricao:
          type: string
          nullable: true
        ativo:
          type: boolean
        destino_email:
          type: string
          nullable: true
        sucesso_mensagem:
          type: string
          nullable: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SiteFormField'
    SiteFormField:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        label:
          type: string
        tipo:
          type: string
          enum: [text, email, tel, textarea, select, checkbox]
        obrigatorio:
          type: boolean
        opcoes:
          type: array
          items:
            type: string
        ordem:
          type: integer
    SiteMedia:
      type: object
      properties:
        id:
          type: string
        path:
          type: string
        alt:
          type: string
          nullable: true
        mime:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        aliases:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    User:
      type: object
      properties:
        id:
          type: string
          description: ULID público
        name:
          type: string
        email:
          type: string
          format: email
          nullable: true
          description: >
            E-mail real. Null quando o login é só por username
            (e-mail sintético @login.local / @equipe.local não é exposto).
        username:
          type: string
          nullable: true
          description: Login alternativo ao e-mail (SPEC-021 / SPEC-026)
        is_active:
          type: boolean
        must_change_password:
          type: boolean
        pessoa_id:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              igreja_id:
                type: string
                nullable: true
        equipes_lideradas:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              nome:
                type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ViewAsLider:
      type: object
      description: Simulação ativa de visão de líder (SPEC-019)
      required: [mode, equipe_ids, equipes]
      properties:
        mode:
          type: string
          enum: [lider-equipe]
        equipe_ids:
          type: array
          items:
            type: string
        equipes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              nome:
                type: string
    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        guard_name:
          type: string
    Permission:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        guard_name:
          type: string
    EccEquipe:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        cor:
          type: string
          nullable: true
        casais_count:
          type: integer
        tem_acesso:
          type: boolean
          description: SPEC-021 — equipe possui usuário de acesso compartilhado
        acesso_username:
          type: string
          nullable: true
          description: Username do acesso da equipe (sem senha)
    EccCasal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        equipe_id:
          type: string
          format: uuid
          nullable: true
        equipe_nome:
          type: string
          nullable: true
        nome:
          type: string
          description: Pessoa A (ordem de cadastro); preferir ele/ela para exibição
        email:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        data_nascimento:
          type: string
          nullable: true
        sexo:
          type: string
          nullable: true
          enum: [M, F]
        nome_conjuge:
          type: string
          description: Pessoa B (ordem de cadastro); preferir ele/ela para exibição
        email_conjuge:
          type: string
          nullable: true
        telefone_conjuge:
          type: string
          nullable: true
        data_nascimento_conjuge:
          type: string
          nullable: true
        sexo_conjuge:
          type: string
          nullable: true
          enum: [M, F]
        ele:
          allOf:
            - $ref: '#/components/schemas/PessoaResumo'
          nullable: true
          description: Cônjuge masculino (por sexo; fallback = pessoa A)
        ela:
          allOf:
            - $ref: '#/components/schemas/PessoaResumo'
          nullable: true
          description: Cônjuge feminino (por sexo; fallback = pessoa B)
        endereco:
          type: string
          nullable: true
        bairro:
          type: string
          nullable: true
        cidade:
          type: string
          nullable: true
        uf:
          type: string
          nullable: true
        cep:
          type: string
          nullable: true
        data_casamento:
          type: string
          nullable: true
        filhos:
          type: string
          nullable: true
        observacoes:
          type: string
          nullable: true
        ficha_com_foto:
          type: boolean
          description: Derivado — true se ele ou ela possui foto cadastrada (somente leitura)
        piloto:
          type: boolean
        engajamento_paroquial:
          type: string
          nullable: true
        habilidades:
          type: string
          nullable: true
        etapas:
          type: array
          items:
            $ref: '#/components/schemas/EccCasalEtapa'
        atividades:
          type: array
          items:
            $ref: '#/components/schemas/EccCasalAtividade'
        preferencias:
          type: array
          items:
            $ref: '#/components/schemas/EccCasalPreferencia'
    EccCasalEtapa:
      type: object
      required: [etapa]
      properties:
        etapa:
          type: integer
          enum: [1, 2, 3]
        ecc_numero:
          type: string
          nullable: true
          maxLength: 20
        data:
          type: string
          format: date
          nullable: true
        local:
          type: string
          nullable: true
          maxLength: 255
    EccCasalAtividade:
      type: object
      required: [ecc_numero, equipe_servico_id, status]
      properties:
        id:
          type: string
          description: ULID (somente resposta)
        ecc_numero:
          type: string
          maxLength: 20
        equipe_servico_id:
          type: string
        equipe_servico_nome:
          type: string
          nullable: true
          description: Somente resposta
        status:
          type: string
          enum: [A, IC, C, N, NA, NN]
        observacao:
          type: string
          nullable: true
    EccCasalPreferencia:
      type: object
      required: [equipe_servico_id]
      properties:
        id:
          type: string
          description: ULID (somente resposta)
        equipe_servico_id:
          type: string
        equipe_servico_nome:
          type: string
          nullable: true
          description: Somente resposta
        ordem:
          type: integer
          nullable: true
          description: 1 = mais preferida
    EccEquipeServico:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        slug:
          type: string
        ordem:
          type: integer
        ativo:
          type: boolean
    PessoaResumo:
      type: object
      properties:
        id:
          type: string
          description: ULID da pessoa
        nome:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        data_nascimento:
          type: string
          nullable: true
        sexo:
          type: string
          nullable: true
          enum: [M, F]
        foto_url:
          type: string
          nullable: true
          description: >
            URL assinada temporária de GET /pessoas/{id}/foto (query tenant + signature).
            Adequada para <img src>; não usa /storage do symlink central.
        nome_usual:
          type: string
          nullable: true
        profissao:
          type: string
          nullable: true
        religiao:
          type: string
          nullable: true
        endereco_profissional:
          type: string
          nullable: true
        telefone_profissional:
          type: string
          nullable: true
    Pessoa:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        email:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        data_nascimento:
          type: string
          nullable: true
        sexo:
          type: string
          nullable: true
          enum: [M, F]
        foto_url:
          type: string
          nullable: true
          description: URL assinada temporária para GET /pessoas/{id}/foto
        nome_usual:
          type: string
          nullable: true
        profissao:
          type: string
          nullable: true
        religiao:
          type: string
          nullable: true
        endereco_profissional:
          type: string
          nullable: true
        telefone_profissional:
          type: string
          nullable: true
        igreja_id:
          type: string
    EventoAgenda:
      type: object
      properties:
        id:
          type: string
        titulo:
          type: string
        inicia_em:
          type: string
          format: date-time
        termina_em:
          type: string
          format: date-time
          nullable: true
        local:
          type: string
          nullable: true
        dono_modulo:
          type: string
        tipo:
          type: string
        referencia_tipo:
          type: string
          nullable: true
        referencia_id:
          type: string
          nullable: true
    EccEvento:
      type: object
      properties:
        id:
          type: string
        titulo:
          type: string
        tipo:
          type: string
          enum: [encontro, anual, servos, perseveranca, formacao]
        inicia_em:
          type: string
          format: date-time
        termina_em:
          type: string
          format: date-time
          nullable: true
        local:
          type: string
          nullable: true
        casal_compras_id:
          type: string
          nullable: true
        evento_agenda_id:
          type: string
          nullable: true
        participantes_count:
          type: integer
        participantes:
          type: array
          items:
            $ref: '#/components/schemas/EccEventoParticipante'
        itens_compra:
          type: array
          items:
            $ref: '#/components/schemas/EccItemCompra'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EccEventoParticipante:
      type: object
      properties:
        casal_id:
          type: string
        casal_rotulo:
          type: string
          nullable: true
    EccItemCompra:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        qtd:
          type: number
        unidade:
          type: string
        status:
          type: string
          enum: [pendente, doado, comprado]
        doador_casal_id:
          type: string
          nullable: true
        doador_rotulo:
          type: string
          nullable: true
        valor_gasto:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EccRecado:
      type: object
      properties:
        id:
          type: string
          description: ULID
        titulo:
          type: string
        corpo:
          type: string
        urgente:
          type: boolean
        fixado:
          type: boolean
        escopo:
          type: string
          enum: [paroquia, etapa, equipe]
        equipe_id:
          type: string
          nullable: true
        etapa:
          type: integer
          nullable: true
          minimum: 1
          maximum: 3
        publicado_em:
          type: string
          format: date-time
          nullable: true
        valido_ate:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [rascunho, publicado]
        criado_por_user_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EccReflexao:
      type: object
      properties:
        id:
          type: string
          description: ULID
        titulo:
          type: string
        passagem_biblica:
          type: string
          nullable: true
        texto:
          type: string
        imagem_url:
          type: string
          nullable: true
          description: URL autenticada relativa da imagem (quando houver)
        tem_imagem:
          type: boolean
        publicado_em:
          type: string
          format: date
        status:
          type: string
          enum: [rascunho, publicado]
        criado_por_user_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
paths:
  /health:
    get:
      summary: Health check (central ou tenant conforme host/contexto)
      responses:
        '200':
          description: OK
  /admin/login:
    post:
      summary: Login super-admin (plataforma)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Token Sanctum + dados do admin
        '403':
          description: Credenciais inválidas
  /admin/me:
    post:
      summary: Super-admin autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do admin
        '401':
          description: Não autenticado
  /admin/logout:
    post:
      summary: Logout super-admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout efetuado
  /admin/tenants:
    get:
      summary: Listar tenants
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de tenants
    post:
      summary: Criar tenant (provisiona banco)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                slug:
                  type: string
                  pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
                aliases:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Tenant criado
        '422':
          description: Validação
  /admin/tenants/{id}:
    get:
      summary: Detalhe do tenant
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant
        '404':
          description: Não encontrado
    put:
      summary: Atualizar tenant
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                aliases:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Atualizado
    delete:
      summary: Remover tenant e banco
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removido
  /web/login:
    post:
      summary: Login web (tenant)
      description: |
        Resolve a organização por `tenant` (slug, apelido ou nome único) sem exigir X-Tenant.
        Campo `login` = e-mail (whereEncrypted LGPD) ou username (SPEC-021).
        `email` permanece como alias de `login`. Retorna cookies + slug canônico.
        Não revoga sessões web existentes (SPEC-010): múltiplos dispositivos/site+app convivem.
        Cada par access/refresh compartilha ability `session:{ulid}`.
        Access token: 30 dias. Refresh token: sem `expires_at` (válido até logout/revogação;
        cookie do refresh usa forever no browser).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant, password]
              properties:
                tenant:
                  type: string
                  description: Slug, apelido ou nome da organização
                login:
                  type: string
                  description: E-mail ou username (SPEC-021)
                email:
                  type: string
                  description: Alias de login (compatibilidade)
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login OK (access_token + cookies + tenant.slug + branding SPEC-014)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  access_token:
                    type: string
                  tenant:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      slug:
                        type: string
                  user:
                    type: object
                  branding:
                    $ref: '#/components/schemas/AppBranding'
        '403':
          description: Credenciais inválidas
        '404':
          description: Organização não encontrada
        '422':
          description: Validação ou nome ambíguo
  /web/change-password:
    post:
      summary: Trocar senha (primeiro acesso / obrigatória)
      description: |
        SPEC-021. Autenticado. Com `must_change_password`, é uma das poucas rotas permitidas
        junto de me/logout/refresh. Limpa a flag após sucesso.
      security:
        - tenantHeader: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password:
                  type: string
                  format: password
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Senha alterada; retorna payload equivalente a /web/me
        '401':
          description: Não autenticado
        '422':
          description: Senha atual incorreta ou validação
  /web/refresh:
    post:
      summary: Renovar access token (cookie refresh ou body refresh_token)
      description: Requer X-Tenant. Usado pelo SPA quando o Bearer expira.
      security:
        - tenantHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Novo access_token
        '401':
          description: Refresh inválido ou expirado
  /web/me:
    post:
      summary: Usuário autenticado (tenant)
      description: |
        Com simulação de líder ativa (SPEC-019), `roles`, `permissions` e `equipes_lideradas`
        são mascarados para o papel efetivo; `view_as` descreve a simulação.
        Inclui `must_change_password` (SPEC-021).
      security:
        - tenantHeader: []
      responses:
        '200':
          description: Dados do usuário (roles/permissions) + branding do app (SPEC-014)
          content:
            application/json:
              schema:
                type: object
                properties:
                  must_change_password:
                    type: boolean
                  branding:
                    $ref: '#/components/schemas/AppBranding'
                  view_as:
                    $ref: '#/components/schemas/ViewAsLider'
                    nullable: true
        '401':
          description: Não autenticado
  /web/view-as/lider-equipe:
    post:
      summary: Ativar simulação de visão de líder de equipe
      description: |
        SPEC-019. Requer `admin-tenant` ou `admin-igreja` na igreja atual.
        Escolhe 1..N equipes da igreja; identidade e auditoria permanecem do admin.
      security:
        - tenantHeader: []
          bearerAuth: []
        - tenantHeader: []
          igrejaHeader: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [equipe_ids]
              properties:
                equipe_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    description: ULID da equipe ECC na igreja atual
      responses:
        '200':
          description: Payload equivalente a `/web/me` com máscara de líder + `view_as`
          content:
            application/json:
              schema:
                type: object
                properties:
                  view_as:
                    $ref: '#/components/schemas/ViewAsLider'
                  branding:
                    $ref: '#/components/schemas/AppBranding'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão (não é admin-tenant / admin-igreja)
        '422':
          description: equipe_ids vazio ou inválido para a igreja
  /web/view-as:
    delete:
      summary: Encerrar simulação de visão (view-as)
      description: SPEC-019. Restaura papéis e permissões reais do admin.
      security:
        - tenantHeader: []
          bearerAuth: []
      responses:
        '200':
          description: Payload equivalente a `/web/me` sem máscara
          content:
            application/json:
              schema:
                type: object
                properties:
                  view_as:
                    nullable: true
                  branding:
                    $ref: '#/components/schemas/AppBranding'
        '401':
          description: Não autenticado
  /app/branding:
    get:
      summary: Branding do app (cores + logo)
      description: SPEC-014. Independente de site_settings.
      security:
        - tenantHeader: []
          bearerAuth: []
      responses:
        '200':
          description: Branding atual
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppBranding'
        '401':
          description: Não autenticado
    patch:
      summary: Atualizar cores do branding do app
      security:
        - tenantHeader: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cores:
                  $ref: '#/components/schemas/AppBrandingCores'
      responses:
        '200':
          description: Branding atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppBranding'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão (requer admin-tenant)
        '422':
          description: Hex inválido ou chaves extras
  /app/branding/logo:
    post:
      summary: Upload da logo do app
      security:
        - tenantHeader: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Logo atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppBranding'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
    delete:
      summary: Remover logo do app
      security:
        - tenantHeader: []
          bearerAuth: []
      responses:
        '204':
          description: Logo removida
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
    get:
      summary: Servir logo do app (URL assinada)
      description: Usado por img; query `tenant` + assinatura. Sem Bearer.
      parameters:
        - name: tenant
          in: query
          required: true
          schema:
            type: string
        - name: expires
          in: query
          schema:
            type: string
        - name: signature
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Imagem
        '404':
          description: Sem logo
  /app/branding/logo-diocese:
    post:
      summary: Upload da logo da diocese (esquerda no PDF)
      security:
        - tenantHeader: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Logo da diocese atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppBranding'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
    delete:
      summary: Remover logo da diocese
      security:
        - tenantHeader: []
          bearerAuth: []
      responses:
        '204':
          description: Removida
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
  /web/logout:
    post:
      summary: Logout web (tenant)
      security:
        - tenantHeader: []
      responses:
        '200':
          description: Logout efetuado
  /igrejas:
    get:
      summary: Listar igrejas acessíveis ao ator (seletor + cadastro)
      security:
        - tenantHeader: []
          bearerAuth: []
        - tenantHeader: []
          igrejaHeader: []
          bearerAuth: []
      responses:
        '200':
          description: Lista de igrejas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Igreja'
        '401':
          description: Não autenticado
    post:
      summary: Criar igreja (admin-tenant)
      security:
        - tenantHeader: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, tipo]
              properties:
                nome:
                  type: string
                tipo:
                  type: string
                  enum: [paroquia, comunidade, outro]
                endereco:
                  type: string
                  nullable: true
                bairro:
                  type: string
                  nullable: true
                cidade:
                  type: string
                  nullable: true
                uf:
                  type: string
                  nullable: true
                  maxLength: 2
                diocese:
                  type: string
                  nullable: true
                cep:
                  type: string
                  nullable: true
                telefone:
                  type: string
                  nullable: true
                email:
                  type: string
                  format: email
                  nullable: true
      responses:
        '201':
          description: Igreja criada
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '422':
          description: Validação
  /igrejas/{id}:
    get:
      summary: Detalhe da igreja
      security:
        - tenantHeader: []
          bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Igreja
        '403':
          description: Sem acesso
        '404':
          description: Não encontrada
    put:
      summary: Atualizar igreja (admin-tenant qualquer; admin-igreja só a própria)
      security:
        - tenantHeader: []
          bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                tipo:
                  type: string
                  enum: [paroquia, comunidade, outro]
                endereco:
                  type: string
                  nullable: true
                bairro:
                  type: string
                  nullable: true
                cidade:
                  type: string
                  nullable: true
                uf:
                  type: string
                  nullable: true
                diocese:
                  type: string
                  nullable: true
                cep:
                  type: string
                  nullable: true
                telefone:
                  type: string
                  nullable: true
                email:
                  type: string
                  format: email
                  nullable: true
      responses:
        '200':
          description: Igreja atualizada
        '403':
          description: Sem permissão
        '404':
          description: Não encontrada
        '422':
          description: Validação
    delete:
      summary: Excluir igreja (admin-tenant; bloqueado se houver vínculos)
      security:
        - tenantHeader: []
          bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removida
        '403':
          description: Sem permissão
        '404':
          description: Não encontrada
        '409':
          description: Possui vínculos (pessoas, equipes ou casais)
  /users:
    get:
      summary: Listar usuários do tenant
      description: >
        Lista paginada. `q` filtra por nome, e-mail real ou username (parcial).
      security:
        - tenantHeader: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
        - name: q
          in: query
          description: Busca por nome, e-mail ou username
          schema:
            type: string
            maxLength: 120
      responses:
        '200':
          description: Lista paginada (data + meta Laravel)
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
    post:
      summary: Criar usuário
      description: >
        SPEC-026. Exige `name`, `password` e ao menos um de `email` | `username`.
        Sem e-mail real, a API gera e-mail sintético interno e expõe `email: null`.
      security:
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                  description: Obrigatório se username omitido
                username:
                  type: string
                  maxLength: 120
                  description: Login sem e-mail (slug); obrigatório se email omitido
                password:
                  type: string
                  format: password
                is_active:
                  type: boolean
                pessoa_id:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Criado
        '422':
          description: Validação (faltam email e username, duplicado ou inválido)
  /users/{id}:
    get:
      summary: Detalhe do usuário
      security:
        - tenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: ULID
      responses:
        '200':
          description: Usuário
        '404':
          description: Não encontrado
    patch:
      summary: Atualizar usuário
      description: >
        SPEC-026. `email` e `username` opcionais; não permite remover ambos os
        identificadores de login.
      security:
        - tenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  nullable: true
                  description: Null ou vazio remove e-mail real (exige username)
                username:
                  type: string
                  nullable: true
                  maxLength: 120
                password:
                  type: string
                is_active:
                  type: boolean
                pessoa_id:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Atualizado
    delete:
      summary: Remover ou desativar usuário
      security:
        - tenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removido
  /users/{id}/roles:
    put:
      summary: Sincronizar papéis do usuário (N papéis)
      description: |
        Substitui papéis do escopo igreja (e admin-tenant se o ator for SuperAdmin).
        Papéis canônicos: admin-tenant, gestor-site, admin-igreja, cadastros-usuarios, cadastros-equipes, cadastros-casais, cadastros-eventos, cadastros-calendario, lider-equipe.
        lider-equipe exige equipe_ids (min 1).
      security:
        - tenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                igreja_id:
                  type: string
                  nullable: true
                  description: Obrigatório se houver papel de igreja
                roles:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        enum: [admin-tenant, gestor-site, admin-igreja, cadastros-usuarios, cadastros-equipes, cadastros-casais, cadastros-eventos, cadastros-calendario, lider-equipe]
                      equipe_ids:
                        type: array
                        items:
                          type: string
                        description: Obrigatório quando name=lider-equipe
      responses:
        '200':
          description: Papéis sincronizados
        '403':
          description: Tentativa de gerenciar admin-tenant sem SuperAdmin
        '422':
          description: Validação
    post:
      summary: Atribuir um papel (atalho; preferir PUT sync)
      security:
        - tenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                igreja_id:
                  type: string
                  nullable: true
                equipe_ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Papel atribuído
        '422':
          description: Validação
    delete:
      summary: Remover um papel (atalho; preferir PUT sync)
      security:
        - tenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                igreja_id:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Papel removido
  /audit-logs:
    get:
      summary: Listar trilha de auditoria do tenant
      description: |
        SPEC-013 / ADR-0007. Create/update/delete de cadastros sensíveis e eventos de auth (login/logout).
        Requer permissão `auditoria.view` (admin-tenant, admin-igreja; SuperAdmin bypass).
      security:
        - tenantHeader: []
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
            enum: [created, updated, deleted, login_success, login_failed, logout, roles_synced]
        - name: auditable_type
          in: query
          schema:
            type: string
            description: Classe curta ou FQCN (ex. User, Pessoa, Igreja)
        - name: actor_user_ulid
          in: query
          schema:
            type: string
        - name: desde
          in: query
          schema:
            type: string
            format: date-time
        - name: ate
          in: query
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          schema:
            type: string
            description: Busca em actor_label / auditable_label
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
            maximum: 100
      responses:
        '200':
          description: Lista paginada de AuditLog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
