  /planejamento/anuais/{id}/status:
    post:
      summary: Transicionar status do calendário anual
      description: |
        Transições: rascunho→coleta→revisao→fechado.
        Reabertura: fechado→revisao (somente planejamento.gerir).
      security: [{bearerAuth: [], tenantHeader: [], igrejaHeader: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [rascunho, coleta, revisao, fechado]}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlanejamentoAnual'
        '401': {description: Não autenticado}
        '403': {description: Sem permissão}
        '422': {description: Transição inválida}
  /planejamento/anuais/{id}/eventos:
    get:
      summary: Listar eventos do calendário anual
      security: [{bearerAuth: [], tenantHeader: [], igrejaHeader: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: mes, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 12}}
        - {name: pastoral_id, in: query, required: false, schema: {type: string}}
        - {name: status_solicitacao, in: query, required: false, schema: {type: string}}
        - {name: local_id, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlanejamentoEvento'
        '401': {description: Não autenticado}
        '403': {description: Sem permissão}
    post:
      summary: Criar evento de planejamento
      description: |
        Conflitos de local/horário retornam em `conflitos[]` com HTTP 201 (não bloqueiam).
        Espaços/recursos (`recursos[]`) acima da capacidade no intervalo → 422 (SPEC-019).
        Coordenador: só pastorais do pivot; em coleta livre; em revisao só se ajuste_solicitado.
      security: [{bearerAuth: [], tenantHeader: [], igrejaHeader: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pastoral_id, titulo, data_inicio]
              properties:
                pastoral_id: {type: string}
                titulo: {type: string}
                data_inicio: {type: string, format: date}
                data_fim: {type: string, format: date, nullable: true}
                hora_inicio: {type: string, nullable: true, example: '19:30'}
                hora_fim: {type: string, nullable: true}
                participantes_media: {type: integer, nullable: true}
                recorrencia_texto: {type: string, nullable: true}
                observacoes: {type: string, nullable: true}
                local_texto: {type: string, nullable: true}
                local_ids:
                  type: array
                  items: {type: string}
                  description: ULIDs de calendario_locais (N:N)
                recursos:
                  type: array
                  items:
                    $ref: '#/components/schemas/PlanejamentoRecursoInput'
                  description: Espaços/recursos alocados (SPEC-019); capacidade estourada → 422
                status_solicitacao:
                  type: string
                  enum: [proposta, confirmado, ajuste_solicitado, reagendado, recusado, cotidiano]
                  description: Somente gestor (planejamento.gerir) pode definir; coordenador cria como proposta
                motivo_ajuste: {type: string, nullable: true}
      responses:
        '201':
          description: Created (pode incluir conflitos[])
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlanejamentoEvento'
        '401': {description: Não autenticado}
        '403': {description: Sem permissão / fora do escopo}
        '422':
          description: Validação ou capacidade de espaço/recurso excedida (SPEC-019)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanejamentoErroCapacidade'
  /planejamento/eventos/{eventoId}:
    get:
      summary: Detalhe do evento de planejamento
      security: [{bearerAuth: [], tenantHeader: [], igrejaHeader: []}]
      parameters:
        - {name: eventoId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlanejamentoEvento'
        '401': {description: Não autenticado}
        '403': {description: Sem permissão}
        '404': {description: Não encontrado}
    patch:
      summary: Atualizar evento de planejamento
      description: Conflitos retornam em `conflitos[]` com HTTP 200 (não bloqueiam).
      security: [{bearerAuth: [], tenantHeader: [], igrejaHeader: []}]
      parameters:
        - {name: eventoId, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pastoral_id: {type: string}
                titulo: {type: string}
                data_inicio: {type: string, format: date}
                data_fim: {type: string, format: date, nullable: true}
                hora_inicio: {type: string, nullable: true}
                hora_fim: {type: string, nullable: true}
                participantes_media: {type: integer, nullable: true}
                recorrencia_texto: {type: string, nullable: true}
                observacoes: {type: string, nullable: true}
                local_texto: {type: string, nullable: true}
                local_ids:
                  type: array
                  items: {type: string}
                recursos:
                  type: array
                  items:
                    $ref: '#/components/schemas/PlanejamentoRecursoInput'
                  description: Substitui a alocação quando enviado (SPEC-019)
                status_solicitacao:
                  type: string
                  enum: [proposta, confirmado, ajuste_solicitado, reagendado, recusado, cotidiano]
                motivo_ajuste: {type: string, nullable: true}
      responses:
        '200':
          description: OK (pode incluir conflitos[])
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlanejamentoEvento'
        '401': {description: Não autenticado}
        '403': {description: Sem permissão / fora do escopo}
        '422':
          description: Validação ou capacidade de espaço/recurso excedida (SPEC-019)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanejamentoErroCapacidade'
    delete:
      summary: Excluir evento de planejamento
      security: [{bearerAuth: [], tenantHeader: [], igrejaHeader: []}]
      parameters:
        - {name: eventoId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: No Content}
        '401': {description: Não autenticado}
        '403': {description: Sem permissão / fora do escopo}
  /planejamento/anuais/{id}/pdf:
