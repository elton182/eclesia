  /planejamento/anuais/{id}/pastorais/tokens:
    get:
      summary: Listar links públicos das pastorais no ano
      description: |
        Somente `planejamento.gerir`. O token é guardado cifrado (APP_KEY) e devolvido em claro
        apenas para links ativos; revogados ou gerados antes da persistência vêm com `token: null`.
      security: [{bearerAuth: [], tenantHeader: [], igrejaHeader: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        planejamento_anual_id: {type: string}
                        pastoral_id: {type: string}
                        token: {type: string, nullable: true}
                        token_preview: {type: string}
                        expires_at: {type: string, format: date-time, nullable: true}
                        revogado_em: {type: string, format: date-time, nullable: true}
                        ativo: {type: boolean}
        '401': {description: Não autenticado}
        '403': {description: Sem permissão}
  /planejamento/anuais/{id}/pastorais/{pastoralId}/token:
    post:
      summary: Gerar ou rotacionar link público da pastoral no ano
      security: [{bearerAuth: [], tenantHeader: [], igrejaHeader: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: pastoralId, in: path, required: true, schema: {type: string}}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: {type: string}
                      pastoral_id: {type: string}
                      token: {type: string}
                      token_preview: {type: string}
                      ativo: {type: boolean}
                  token: {type: string, description: Token em claro (atalho)}
    delete:
      summary: Revogar link da pastoral no ano
      security: [{bearerAuth: [], tenantHeader: [], igrejaHeader: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: pastoralId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: No Content}
  /public/planejamento/{token}:
    get:
      summary: Dados públicos do link da pastoral
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK}
        '422': {description: Token inválido}
  /public/planejamento/{token}/eventos:
    get:
      summary: Listar eventos da pastoral do token (sem outras pastorais)
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK}
    post:
      summary: Criar proposta via link (ano em coleta)
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, data_inicio]
              description: Exige `local_texto` ou ao menos um espaço em `recursos`.
              properties:
                titulo: {type: string}
                data_inicio: {type: string, format: date}
                data_fim: {type: string, format: date, nullable: true}
                hora_inicio: {type: string, nullable: true}
                hora_fim: {type: string, nullable: true}
                local_texto: {type: string, nullable: true}
                observacoes: {type: string, nullable: true}
                recursos:
                  type: array
                  items:
                    $ref: '#/components/schemas/PlanejamentoRecursoInput'
      responses:
        '201': {description: Created}
        '422':
          description: Coleta fechada, validação ou capacidade excedida (sem dados de outras pastorais)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanejamentoErroCapacidade'
  /public/planejamento/{token}/disponibilidade:
    get:
      summary: Disponibilidade de espaços/recursos no intervalo (link da pastoral)
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
        - {name: data_inicio, in: query, required: true, schema: {type: string, format: date}}
        - {name: data_fim, in: query, required: false, schema: {type: string, format: date}}
        - {name: hora_inicio, in: query, required: false, schema: {type: string, example: '19:00'}}
        - {name: hora_fim, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlanejamentoDisponibilidade'
        '422': {description: Token inválido ou parâmetros inválidos}
