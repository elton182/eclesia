      description: |
        Substitui papéis do escopo igreja (e admin-tenant se o ator for SuperAdmin).
        Papéis canônicos: admin-tenant, gestor-site, admin-igreja, cadastros-usuarios, cadastros-equipes, cadastros-casais, cadastros-eventos, cadastros-escalas, lider-equipe.
