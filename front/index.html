<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4E1220">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Apostolus">
    <meta name="application-name" content="Apostolus">
    <!-- Câmera via input capture / getUserMedia em PWA instalada -->
    <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=()">
    <title>Apostolus — Gestão inteligente para Igrejas e Paróquias</title>
    <meta name="description" content="Plataforma modular de gestão eclesial: pessoas, equipes, eventos, calendário e finanças da sua paróquia em um só lugar, com dados isolados por organização e conformidade com a LGPD.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Apostolus — Gestão inteligente para Igrejas e Paróquias">
    <meta property="og:description" content="Pessoas, equipes, eventos, calendário e finanças da sua comunidade em uma plataforma modular multi-tenant.">
    <meta property="og:locale" content="pt_BR">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- Fallback se o bundle não montar (SW/cache stale após deploy). -->
    <script>
      (function () {
        var GUARD = 'eclesia_bundle_reload'
        var booted = false
        var root = document.getElementById('app')
        if (!root) return

        var obs = new MutationObserver(function () {
          if (root.childElementCount > 0) {
            booted = true
            try { sessionStorage.removeItem(GUARD) } catch (e) {}
            obs.disconnect()
          }
        })
        obs.observe(root, { childList: true })

        setTimeout(function () {
          if (booted || root.childElementCount > 0) return
          obs.disconnect()
          var tried = false
          try { tried = sessionStorage.getItem(GUARD) === '1' } catch (e) {}

          root.setAttribute('data-testid', 'boot-fallback')
          root.style.cssText =
            'min-height:100vh;display:flex;align-items:center;justify-content:center;' +
            'padding:24px;font-family:system-ui,sans-serif;background:#F7F4EF;color:#1A0C10;text-align:center'
          root.innerHTML =
            '<div style="max-width:22rem">' +
            '<p style="font-size:1.125rem;font-weight:600;margin:0 0 8px">Não foi possível abrir o Apostolus</p>' +
            '<p style="font-size:0.875rem;line-height:1.45;color:#5C4A4E;margin:0 0 16px">' +
            (tried
              ? 'Limpe os dados do site neste navegador (ou abra em aba anônima) e tente de novo.'
              : 'Isso costuma acontecer após uma atualização. Toque em Atualizar para recarregar.') +
            '</p>' +
            (tried
              ? ''
              : '<button type="button" id="eclesia-boot-reload" style="appearance:none;border:0;border-radius:10px;' +
                'background:#4E1220;color:#fff;font-weight:600;padding:12px 18px;font-size:0.9375rem;cursor:pointer">' +
                'Atualizar</button>') +
            '</div>'

          var btn = document.getElementById('eclesia-boot-reload')
          if (!btn) return
          btn.addEventListener('click', function () {
            try { sessionStorage.setItem(GUARD, '1') } catch (e) {}
            var done = function () { location.reload() }
            var pending = []
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              pending.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister() }))
                }),
              )
            }
            if (window.caches && caches.keys) {
              pending.push(
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k) }))
                }),
              )
            }
            Promise.all(pending).then(done, done)
          })
        }, 8000)
      })()
    </script>
  </body>
</html>
